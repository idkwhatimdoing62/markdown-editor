name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.1.34)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  quality:
    name: Quality and dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  performance:
    name: Long-document performance gate
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Enforce long-document budgets
        shell: pwsh
        run: .\scripts\benchmark-long-docs.ps1 -EnforceBudgets
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-long-document-performance
          path: artifacts/performance
          if-no-files-found: warn

  windows:
    name: Windows packages
    needs: [quality, performance]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $stage = Join-Path $env:RUNNER_TEMP "markdown-editor-$version"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/markdown-editor.exe $stage
          Copy-Item README.md $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist/markdown-editor-v$version-windows-x86_64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $iscc)) { throw "ISCC.exe not found" }
          & $iscc installer/markdown-editor.iss

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/markdown-editor-v*-windows-x86_64.zip
            dist/markdown-editor-v*-windows-x86_64-setup.exe
          if-no-files-found: error

  macos:
    name: macOS universal package
    needs: [quality, performance]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Run tests
        run: cargo test

      - name: Build universal app ZIP
        run: bash scripts/build-macos.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: dist/markdown-editor-v*-macos-universal.app.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: dist
      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: macos-package
          path: dist
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then tag="${INPUT_TAG}"; fi
          [[ "$tag" == v* ]] || { echo "Tag must start with v" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Prepare release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No changelog entry found for ${RELEASE_TAG}" >&2
            exit 1
          fi
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Markdown Editor ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            dist/markdown-editor-v*-windows-x86_64.zip
            dist/markdown-editor-v*-windows-x86_64-setup.exe
            dist/markdown-editor-v*-macos-universal.app.zip
