[package]
name = "markdown-editor"
version = "0.1.23"
edition = "2024"

[features]
benchmark = []

[[bin]]
name = "markdown-benchmark"
path = "src/bin/markdown_benchmark.rs"
required-features = ["benchmark"]

[dependencies]
base64 = "0.22"
eframe = "0.35.0"
egui = "0.35.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify = "8.2"
printpdf = "0.12.5"
pulldown-cmark = "0.13.4"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1.30"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
wry = { version = "0.55.1", default-features = false, features = ["protocol"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
